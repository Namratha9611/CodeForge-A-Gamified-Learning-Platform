<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        input,
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #333;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error {
            background: #f44336;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .success {
            background: #4CAF50;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>🔍 Login API Test</h1>
    <p>Test credentials: test@test.com / test123</p>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" value="test@test.com" required>
        <input type="password" id="password" placeholder="Password" value="test123" required>
        <button type="submit">Test Login</button>
    </form>

    <div id="result"></div>

    <script>
        const form = document.getElementById('loginForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            resultDiv.innerHTML = '<div>⏳ Testing login...</div>';

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ Login Successful!</div>
                        <div><strong>Response:</strong></div>
                        <div>${JSON.stringify(data, null, 2)}</div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ Login Failed</div>
                        <div><strong>Status:</strong> ${response.status}</div>
                        <div><strong>Error:</strong> ${data.message || 'Unknown error'}</div>
                        <div><strong>Full Response:</strong></div>
                        <div>${JSON.stringify(data, null, 2)}</div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Network Error</div>
                    <div><strong>Error:</strong> ${error.message}</div>
                    <div>Make sure the backend is running on http://localhost:5000</div>
                `;
            }
        });
    </script>
</body>

</html>
