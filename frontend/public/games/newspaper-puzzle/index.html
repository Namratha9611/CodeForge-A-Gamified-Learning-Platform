<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Codeword</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="paper-container">
        <header>
            <h1>The Daily Codeword</h1>
            <div class="level-info">
                <span>Technical Interview Edition</span>
                <span>Level <span id="level-num">1</span></span>
            </div>
        </header>

        <div class="game-area">
            <!-- 6x6 Grid -->
            <div class="grid-container">
                <div id="codeword-grid">
                    <!-- JS fills this -->
                </div>
            </div>

            <!-- Clues -->
            <div class="clues-section">
                <h3>ACROSS</h3>
                <ul id="across-clues" class="clue-list"></ul>

                <h3>DOWN</h3>
                <ul id="down-clues" class="clue-list"></ul>
            </div>
        </div>

        <!-- Decoder Key -->
        <div class="decoder-bar">
            <div class="alphabet-row" id="decoder-container">
                <!-- JS fills this -->
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div class="modal">
        <div class="modal-content">
            <h2>PUZZLE SOLVED!</h2>
            <p>Generating next level data...</p>
            <button class="next-btn" id="next-level-btn">Start Next Level</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
